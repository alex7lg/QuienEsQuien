<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quién es Quién</title>
    <link rel="icon" href="/fotos/logo.jpg">

    <link rel="stylesheet" href="styles.css">
</head>

<body>
<header>

    <div id="titulo">
        <h1>🎭 Quién es Quién</h1>

        <h2>
            Bienvenida a nuestro <span style="color: rgb(124, 124, 236); font-weight: bold;">Quién es Quién</span> personalizado!
            Pulsa sobre los personajes para descartarlos
        </h2>

        <p>
            Se aceptan sugerencias para nuevos personajes
        </p>

        <button id="reset-tablero">
            Reiniciar tablero
        </button>
    </div>

    <div id="mi-personaje-box">
        <h2>Tu personaje</h2>

        <img id="mi-personaje-img" src="" alt="">

        <p id="mi-personaje-nombre"></p>

        <button id="nuevo-personaje">
            Nuevo personaje
        </button>
    </div>

</header>

<main id="tablero"></main>

<script src="app.js"></script>

</body>
</html>
